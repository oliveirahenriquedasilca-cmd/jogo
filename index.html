<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desvie dos Obstáculos</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101020;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px;
    color: #00d9ff;
}

canvas {
    background: #080814;
    border: 3px solid #00d9ff;
    display: block;
    margin: 20px auto;
    max-width: 95%;
}

button {
    padding: 12px 25px;
    background: #00d9ff;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #009fbb;
}

p {
    margin: 10px;
}
</style>
</head>

<body>

<h1>⚡ DESVIE DOS OBSTÁCULOS</h1>
<p>Pontuação: <span id="score">0</span></p>

<canvas id="game" width="400" height="500"></canvas>

<button onclick="restart()">Jogar novamente</button>

<p>Use as setas ← → para movimentar.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");

let player, obstacles, score, gameOver, speed;
let keys = {};

function restart() {
    player = {
        x: 175,
        y: 440,
        width: 50,
        height: 35,
        speed: 6
    };

    obstacles = [];
    score = 0;
    speed = 3;
    gameOver = false;

    scoreText.textContent = score;
    gameLoop();
}

document.addEventListener("keydown", e => {
    keys[e.key] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key] = false;
});

function createObstacle() {
    obstacles.push({
        x: Math.random() * 360,
        y: -30,
        width: 30 + Math.random() * 30,
        height: 30
    });
}

function drawPlayer() {
    ctx.fillStyle = "#00d9ff";
    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );
}

function drawObstacles() {
    ctx.fillStyle = "#ff1744";

    obstacles.forEach(obstacle => {
        ctx.fillRect(
            obstacle.x,
            obstacle.y,
            obstacle.width,
            obstacle.height
        );
    });
}

function collision(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function gameLoop() {
    if (gameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (keys["ArrowLeft"] && player.x > 0) {
        player.x -= player.speed;
    }

    if (keys["ArrowRight"] &&
        player.x < canvas.width - player.width) {
        player.x += player.speed;
    }

    if (Math.random() < 0.025 + speed * 0.002) {
        createObstacle();
    }

    obstacles.forEach(obstacle => {
        obstacle.y += speed;

        if (collision(player, obstacle)) {
            gameOver = true;
        }
    });

    obstacles = obstacles.filter(
        obstacle => obstacle.y < canvas.height
    );

    score++;
    speed = 3 + score / 1000;

    scoreText.textContent = Math.floor(score / 10);

    drawPlayer();
    drawObstacles();

    if (gameOver) {
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "35px Arial";
        ctx.fillText("GAME OVER", 200, 230);

        ctx.font = "20px Arial";
        ctx.fillText(
            "Pontuação: " + Math.floor(score / 10),
            200,
            270
        );

        return;
    }

    requestAnimationFrame(gameLoop);
}

restart();
</script>

</body>
</html>
